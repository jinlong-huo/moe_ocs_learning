# Authentic EPS baseline: real Qwen weights + replay, 3-tier electrical fabric.
#
# This is the reference point every OCS model is compared against. The fabric
# uses field-cited numbers (see src/comm/topology.py):
#   intra-node  NVLink/NVSwitch  1 us  / 900 GB/s
#   intra-pod   InfiniBand NDR   3 us  / 400 Gb/s
#   cross-pod   core fabric     10 us  / 200 Gb/s
#
# Fabric: 2 pods × 2 nodes × 1 rank (world_size 4) — a mix of intra-pod and
# cross-pod pairs. OCS disabled: pure electrical packet switching.
#
# Compare against the fixed-delay OCS models:
#   python3 -m src.launcher --config configs/qwen_eps_baseline.yaml
#   python3 -m src.launcher --config configs/ocs_alpha_model.yaml
#   python3 -m src.launcher --config configs/ocs_beta_model.yaml
#   python3 scripts/compare_ocs_models.py   # runs all three + comparison table

extends: qwen_replay

topology:
  enabled: true
  num_pods: 2
  nodes_per_pod: 2
  ranks_per_node: 1
  intra_node_latency_us: 1.0
  intra_pod_latency_us: 3.0
  cross_pod_latency_us: 10.0
  intra_node_bandwidth_gbps: 900.0
  intra_pod_bandwidth_gbps: 400.0
  cross_pod_bandwidth_gbps: 200.0

runtime:
  mode: "overlap"          # EPS: route -> scatter -> compute -> gather pipeline
  num_steps: 5
