# Routing-replay config: feed real MoE routing traces into the OCS simulator.
# Extends synthetic_moe to keep the same expert/compute layout, but replaces
# synthetic routing with captured routing from a real model.

extends: synthetic_moe

routing:
  strategy: "replay"                       # use ReplayRouter instead of fixed/top1/top2

routing_replay:
  enabled: true
  trace_path: "data/routing_traces/routing.json"  # path to RoutingTrace JSON
  layer_idx: 0                             # which MoE layer to replay (0-indexed)
  cycle_layers: false                      # if true, cycles through all layers on each step

runtime:
  mode: "overlap"                          # can use any mode: serial, overlap, ocs_pipeline, ocs_dbo
  num_steps: 10

data:
  batch_size: 32
  seq_len: 64
  num_microbatches: 4
