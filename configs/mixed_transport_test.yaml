# Mixed EPS+OCS transport test configuration
# Exercises the PathResolver: OCS for plan pairs, EPS fallback for rest

extends: synthetic_moe

runtime:
  mode: ocs_preset
  num_steps: 2

ocs:
  enabled: true
  max_circuits: 8
  reconfig_time_us: 100.0
  circuit_latency_us: 1.0
  circuit_bandwidth_gbps: 400.0
  placement_strategy: affinity
  mixed_transport:
    enabled: true
  preset:
    source: trace
    plan_path: ""

topology:
  enabled: true
  num_pods: 2
  nodes_per_pod: 1
  ranks_per_node: 2
  intra_node_latency_us: 1.0
  intra_pod_latency_us: 5.0
  cross_pod_latency_us: 20.0
  intra_node_bandwidth_gbps: 900.0
  intra_pod_bandwidth_gbps: 200.0
  cross_pod_bandwidth_gbps: 100.0

data:
  batch_size: 16
  seq_len: 64
  num_microbatches: 4

delay:
  enabled: false

profiling:
  export_trace: true
  trace_dir: "outputs/traces"
