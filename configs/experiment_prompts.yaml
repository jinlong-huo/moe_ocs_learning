# Prompt Taxonomy for Cross-Prompt Affinity Experiments
#
# Designed to test the core hypothesis:
#   Semantically similar prompts → similar expert routing → good cross-prompt circuit hit rates
#   Semantically different prompts → different expert routing → poor cross-prompt hit rates
#
# Each group has:
#   id:      unique identifier (used for output directory naming)
#   domain:  semantic domain label (used for clustering analysis)
#   prompt:  the actual input text (must be unambiguous for the model)
#   role:    "train" (build affinity from this) | "test" (evaluate on this) | "baseline" (EPS comparison)
#
# IMPORTANT: All captures should use --temp 0 for deterministic routing.

groups:
  # ── ML / Mixture of Experts domain ──────────────────────────────
  # These should share significant expert affinity.
  - id: ml_moe_1
    domain: ml_moe
    role: train
    prompt: >-
      Explain how the Mixture of Experts architecture works in transformer language models,
      including the gating mechanism, expert parallelism, and how tokens are routed to
      different expert networks.

  - id: ml_moe_2
    domain: ml_moe
    role: train
    prompt: >-
      Describe how sparse MoE models use a learned gating function to route tokens
      to different expert feed-forward networks, and explain the role of top-k selection
      and load balancing in this process.

  - id: ml_moe_3
    domain: ml_moe
    role: test
    prompt: >-
      What is expert parallelism and how does top-k gating improve the computational
      efficiency and scalability of large language models compared to dense architectures?

  # ── ML / Transformer Attention domain ───────────────────────────
  # Related to ml_moe but a distinct sub-domain. Should show MODERATE overlap.
  - id: ml_attention_1
    domain: ml_attention
    role: test
    prompt: >-
      Explain the multi-head self-attention mechanism in transformer models,
      including how queries, keys, and values interact to capture relationships
      between tokens in a sequence.

  # ── History domain ──────────────────────────────────────────────
  # Completely different from ML. Should show LOW affinity overlap.
  - id: history_1
    domain: history
    role: train
    prompt: >-
      Explain the major causes and consequences of the French Revolution,
      including the social, economic, and political factors that led to
      the overthrow of the monarchy in 1789.

  - id: history_2
    domain: history
    role: test
    prompt: >-
      Describe the key events and prominent figures of the French Revolution
      from 1789 to 1799, including the Reign of Terror, the rise of Napoleon,
      and the long-term impact on European politics.

  # ── Cooking domain ──────────────────────────────────────────────
  # Completely different from both ML and history. Should show LOW overlap.
  - id: cooking_1
    domain: cooking
    role: train
    prompt: >-
      Provide a detailed step-by-step recipe for making traditional Italian
      lasagna from scratch, including the preparation of the bolognese sauce,
      bechamel sauce, and the layering technique.

  - id: cooking_2
    domain: cooking
    role: test
    prompt: >-
      Explain the techniques and ingredients needed for making fresh pasta
      from scratch, including how to achieve the right dough consistency and
      the best flour and egg ratios for different pasta shapes.

# ── Experiment configurations ──────────────────────────────────────

# How the traces should be used for cross-validation:
experiments:
  # Experiment 1: Same-domain generalization (ml_moe train → ml_moe test)
  - name: same_domain_moe
    description: "Affinity from 2 MoE prompts → test on a 3rd MoE prompt"
    train_ids: [ml_moe_1, ml_moe_2]
    test_ids: [ml_moe_3]
    hypothesis: "HIGH hit rate — same-domain prompts share expert patterns"

  # Experiment 2: Cross-domain (ml_moe → history)
  - name: cross_domain_ml_to_history
    description: "Affinity from MoE prompts → test on history prompt"
    train_ids: [ml_moe_1, ml_moe_2]
    test_ids: [history_2]
    hypothesis: "LOW hit rate — completely different expert patterns"

  # Experiment 3: Cross-domain (history → history is same-domain control)
  - name: same_domain_history
    description: "Affinity from history → test on history (domain consistency check)"
    train_ids: [history_1]
    test_ids: [history_2]
    hypothesis: "HIGH hit rate — same domain should generalize"

  # Experiment 4: Cross-domain (history → cooking)
  - name: cross_domain_history_to_cooking
    description: "Affinity from history → test on cooking"
    train_ids: [history_1]
    test_ids: [cooking_2]
    hypothesis: "LOW hit rate — different domains should not generalize"

  # Experiment 5: Near-domain (ml_moe → ml_attention)
  - name: near_domain_moe_to_attention
    description: "Affinity from MoE prompts → test on attention prompt (related but distinct)"
    train_ids: [ml_moe_1, ml_moe_2]
    test_ids: [ml_attention_1]
    hypothesis: "MODERATE hit rate — related domains share some expert patterns"

# ── Capture settings ───────────────────────────────────────────────
capture:
  model: "./models/Qwen3.6-35B-A3B-4bit"
  temp: 0.0         # Greedy decoding for deterministic routing
  max_tokens: 256    # Generate enough tokens for meaningful affinity statistics
  output_dir: "outputs/experiment_traces"
