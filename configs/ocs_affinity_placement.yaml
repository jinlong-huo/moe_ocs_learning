# Affinity-driven placement for OCS — the merged single story, on REAL Qwen weights.
#
#   Step 1 (verify):  python3 scripts/verify_live_invariance.py
#     Gates that affinity is independent of node distribution (placement)
#     and of the network topology config, so a recorded routing trace can
#     safely drive OCS configuration.
#
#   Step 2 (apply):   python3 -m src.launcher --config configs/ocs_affinity_placement.yaml
#     Uses the recorded affinity to configure BOTH halves of placement on a
#     2 pod x 4 node x 4 GPU (32-rank) fabric with real Qwen SwitchGLU
#     experts (256 experts, 8 per rank):
#       - placement.strategy=affinity  : greedy co-activation clustering sets
#         expert -> rank, so co-activated experts share a rank (compute side:
#         more intra-rank work, less inter-rank traffic).
#       - placement.rank_locations     : plan-centrality packing sets
#         rank -> physical location, so the top circuit pairs sit intra-node /
#         intra-pod (comm side: cross-pod exposure of the top-16 plan drops
#         5 -> 2 pairs in the live Qwen3.6 capture). The table is exported by
#         the gate (logs/ocs_invariance_report.json -> affinity_adjustment).
#
# Routing never changes — only where experts live and what travel costs.
# The OCS online controller then keeps high-affinity rank-pair circuits hot.

extends: qwen_ocs_base

world_size: 32

model:
  num_experts: 256         # must match the trace (world_size x experts_per_rank)
  experts_per_rank: 8

qwen:
  num_experts: 256         # all exported experts of layer 0
  top_k: 2                 # replay downsamples the captured top-8 to top-2

placement:
  strategy: affinity
  trace_path: data/routing_traces/routing.json
  rank_locations:          # plan-centrality order (from verify_live_invariance.py)
    - [1, 0, 2]  # rank 0
    - [0, 2, 2]  # rank 1
    - [1, 0, 3]  # rank 2
    - [1, 1, 0]  # rank 3
    - [0, 2, 0]  # rank 4
    - [0, 1, 0]  # rank 5
    - [0, 3, 3]  # rank 6
    - [1, 1, 1]  # rank 7
    - [0, 0, 0]  # rank 8
    - [0, 1, 3]  # rank 9
    - [0, 3, 0]  # rank 10
    - [0, 2, 3]  # rank 11
    - [1, 1, 2]  # rank 12
    - [1, 1, 3]  # rank 13
    - [1, 2, 0]  # rank 14
    - [0, 1, 1]  # rank 15
    - [1, 0, 0]  # rank 16
    - [1, 2, 1]  # rank 17
    - [0, 2, 1]  # rank 18
    - [0, 0, 3]  # rank 19
    - [1, 2, 2]  # rank 20
    - [0, 0, 2]  # rank 21
    - [0, 1, 2]  # rank 22
    - [0, 3, 2]  # rank 23
    - [0, 0, 1]  # rank 24
    - [0, 3, 1]  # rank 25
    - [1, 2, 3]  # rank 26
    - [1, 3, 0]  # rank 27
    - [1, 3, 1]  # rank 28
    - [1, 0, 1]  # rank 29
    - [1, 3, 2]  # rank 30
    - [1, 3, 3]  # rank 31


ocs:
  enabled: true
  max_circuits: 16
  placement_strategy: affinity   # OCS circuit pool tracks co-activation
  online:
    update_interval_steps: 1
    decay_factor: 0.99

runtime:
  mode: ocs_online               # adaptive affinity-driven circuit management
  num_steps: 3

data:
  batch_size: 1
  seq_len: 32
  num_microbatches: 4
