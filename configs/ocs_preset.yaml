# OCS Preset mode — pre-configure circuits from training affinity
# Circuits are pre-established before the first micro-batch. Zero
# runtime reconfiguration occurs during inference. Models the
# scenario where training-time routing patterns are used to
# pre-configure the OCS fabric for inference.

extends: synthetic_moe

ocs:
  enabled: true
  max_circuits: 16
  reconfig_time_us: 100.0       # still relevant: plan pre-load cost
  circuit_latency_us: 1.0
  circuit_bandwidth_gbps: 400.0
  placement_strategy: affinity   # use co-activation affinity for placement

  # Preset-specific configuration
  preset:
    source: trace                # "trace": use affinity from routing trace
                                 # "plan": load pre-computed plan from file
    plan_path: ""                # path to plan JSON (used when source=plan)
    strategy: coactivation       # coactivation | volume | frequency

runtime:
  mode: ocs_preset               # pre-established circuits, zero runtime reconfig
  num_steps: 5

data:
  batch_size: 16
  seq_len: 64
  num_microbatches: 4            # >= 3 to show pipeline overlap benefit

delay:
  enabled: false
  comm_delay_us: 0
  comm_delay_jitter_us: 0
