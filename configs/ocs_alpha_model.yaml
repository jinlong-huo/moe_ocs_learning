# OCS alpha model — fixed-delay cost model, fast switch class.
#
# Field-standard OCS simulation: every transfer pays the SAME tier-aware EPS
# cost as the electrical baseline, plus a FIXED reconfiguration delay once
# per newly established circuit, under a per-rank circuit budget with
# FIFO port reassignment):
#
# In alpha-beta form:  alpha_ocs = alpha_eps + T_reconfig (cold circuit)
#                       beta_ocs  = beta_eps  (same fabric)
#
# alpha = fast optical switch class: SOA-gated / ring-resonator switches
# reconfigure in ns–us (cf. Sirius, SIGCOMM 2016: nanosecond optical
# switching). T_reconfig = 1 us here, and the switch has FULL FAN-OUT —
# max_circuits: 3 = world_size - 1, one circuit (wavelength) per destination,
# WSS-style, so reconfiguration only happens when the target set changes.
#
# Same 2×2×1 fabric as configs/qwen_eps_baseline.yaml for a direct
# apples-to-apples comparison:
#   python3 scripts/compare_ocs_models.py   # EPS vs alpha vs beta table

extends: qwen_ocs_base

topology:
  enabled: true
  num_pods: 2
  nodes_per_pod: 2
  ranks_per_node: 1
  intra_node_latency_us: 1.0
  intra_pod_latency_us: 3.0
  cross_pod_latency_us: 10.0
  intra_node_bandwidth_gbs: 900.0
  intra_pod_bandwidth_gbs: 50.0
  cross_pod_bandwidth_gbs: 25.0

ocs:
  enabled: true
  reconfig_time_us: 1.0       # alpha: SOA / ring-resonator class (ns-us)
  max_circuits: 3             # full fan-out: one circuit per destination

runtime:
  mode: "ocs_pipeline"        # runtime reconfig, paid inline before scatter
  num_steps: 5
