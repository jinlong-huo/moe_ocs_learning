# OCS beta model — fixed-delay cost model, MEMS switch class.
#
# Field-standard OCS simulation: every transfer pays the SAME tier-aware EPS
# cost as the electrical baseline, plus a FIXED reconfiguration delay once
# per newly established circuit (no LRU cache — a per-rank circuit budget
# with FIFO port reassignment):
#
#   T_ocs = T_eps(src, dst, bytes) + T_reconfig × N_switches
#
# beta = 3D-MEMS beam-steering switch: tens of us of mechanical mirror
# motion, plus damping/settling that pushes deployed systems (Google
# Apollo/Palomar-class OCS) into the ms range. T_reconfig = 50 us here
# (mechanical-motion bound), and the switch is PORT-LIMITED:
# max_circuits: 1 = a single outgoing port per rank, so a micro-batch
# touching K destinations serially re-points the mirror K times — the
# authentic source of OCS reconfiguration pressure on all-to-all traffic.
#
# Same 2×2×1 fabric as configs/qwen_eps_baseline.yaml for a direct
# apples-to-apples comparison:
#   python3 scripts/compare_ocs_models.py   # EPS vs alpha vs beta table

extends: qwen_ocs_base

topology:
  enabled: true
  num_pods: 2
  nodes_per_pod: 2
  ranks_per_node: 1
  intra_node_latency_us: 1.0
  intra_pod_latency_us: 3.0
  cross_pod_latency_us: 10.0
  intra_node_bandwidth_gbps: 900.0
  intra_pod_bandwidth_gbps: 400.0
  cross_pod_bandwidth_gbps: 200.0

ocs:
  enabled: true
  cost_model: fixed_delay     # EPS tier cost + fixed reconfig per switch
  reconfig_time_us: 50.0      # beta: 3D-MEMS beam-steering (tens of us + damping)
  max_circuits: 1             # single-port space switch: serial re-pointing

runtime:
  mode: "ocs_pipeline"        # runtime reconfig, paid inline before scatter
  num_steps: 5
