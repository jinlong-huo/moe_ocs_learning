# OCS preset ablation: compare strategies for pre-configuration
# 
# Strategies:
#   oracle:     upper bound — pre-config from inference trace itself (perfect knowledge)
#   affinity:   pre-config from training co-activation affinity
#   volume:     pre-config from training traffic volume matrix
#   random:     lower bound — random circuit placement
#   none:       no OCS at all (EPS baseline)
#
# Usage: run each strategy, then compare with scripts/compare_ocs.py

extends: synthetic_moe

ocs:
  enabled: true
  max_circuits: 16
  reconfig_time_us: 100.0
  circuit_latency_us: 1.0
  circuit_bandwidth_gbps: 400.0
  placement_strategy: affinity

  preset:
    source: trace
    plan_path: ""

ablation:
  strategies:
    - name: oracle
      description: pre-config from inference trace (upper bound)
      preset_source: trace_infer
    
    - name: affinity
      description: pre-config from training co-activation
      preset_source: trace_train
    
    - name: volume
      description: pre-config from training traffic volume
      preset_source: trace_train
    
    - name: random
      description: random circuit placement (lower bound)
      preset_source: random
    
    - name: none
      description: EPS baseline (no OCS)
      preset_source: none
      ocs_enabled: false

evaluation:
  metrics:
    - hit_rate           # % of A2A pairs already in OCS pool
    - latency_p50         # median per-step latency
    - latency_p99         # 99th percentile latency
    - traffic_over_ocs    # bytes transferred over OCS
    - preset_utilization  # % of pre-set circuits used
    - preset_waste        # % of pre-set circuits never used

runtime:
  mode: ocs_preset
  num_steps: 5

data:
  batch_size: 16
  seq_len: 64
  num_microbatches: 4

delay:
  enabled: false
  comm_delay_us: 0
  comm_delay_jitter_us: 0
